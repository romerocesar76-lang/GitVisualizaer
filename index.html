<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --border: #1e2330;
    --text: #c9d1e0;
    --text-dim: #4a5568;
    --accent: #00e5ff;
    --green: #39ff8a;
    --orange: #ff6b35;
    --purple: #b36bff;
    --yellow: #ffd166;
    --pink: #ff4fa3;
    --branch-colors: #00e5ff, #39ff8a, #ff6b35, #b36bff, #ffd166, #ff4fa3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }

  .branch-badge {
    background: #1a1e2a;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .branch-badge::before { content: '⎇'; font-size: 13px; }

  .hint {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Canvas area */
  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #gitCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  #gitCanvas:active { cursor: grabbing; }

  /* Sidebar */
  .sidebar {
    width: 280px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section h3 {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .branch-list { display: flex; flex-direction: column; gap: 6px; }
  .branch-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 4px;
    background: #1a1e2a;
    border: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .branch-item.active { border-color: var(--accent); }
  .branch-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .log-area {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .log-area::-webkit-scrollbar { width: 4px; }
  .log-area::-webkit-scrollbar-track { background: transparent; }
  .log-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .log-entry {
    font-size: 10px;
    padding: 5px 8px;
    border-radius: 3px;
    margin-bottom: 3px;
    line-height: 1.5;
    border-left: 2px solid transparent;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .log-entry.success { border-color: var(--green); color: var(--green); background: rgba(57,255,138,0.05); }
  .log-entry.error   { border-color: var(--orange); color: var(--orange); background: rgba(255,107,53,0.05); }
  .log-entry.info    { border-color: var(--accent); color: var(--text-dim); }
  .log-entry.cmd     { border-color: var(--purple); color: var(--purple); background: rgba(179,107,255,0.05); }

  /* Bottom input */
  footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .quick-commands {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .qcmd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .qcmd:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,255,0.05);
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 14px;
    transition: border-color 0.2s;
  }
  .input-row:focus-within { border-color: var(--accent); }

  .prompt-prefix {
    color: var(--green);
    font-size: 13px;
    user-select: none;
    white-space: nowrap;
  }

  #cmdInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    padding: 11px 0;
    caret-color: var(--accent);
  }
  #cmdInput::placeholder { color: var(--text-dim); }

  .run-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    padding: 5px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .run-btn:hover { opacity: 0.85; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 12px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* HEAD label */
  .head-badge {
    font-size: 9px;
    letter-spacing: 1px;
    background: var(--yellow);
    color: #000;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 700;
    margin-left: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">git<span>vis</span></div>
  <div class="branch-badge" id="currentBranchBadge">main</div>
  <div class="hint">↑↓ historial de comandos &nbsp;|&nbsp; Enter para ejecutar</div>
</header>

<div class="main">
  <div class="canvas-wrap">
    <canvas id="gitCanvas"></canvas>
  </div>
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Ramas</h3>
      <div class="branch-list" id="branchList"></div>
    </div>
    <div class="sidebar-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
      <h3>Historial</h3>
      <div class="log-area" id="logArea"></div>
    </div>
  </div>
</div>

<footer>
  <div class="quick-commands">
    <button class="qcmd" onclick="runCmd('git init')">init</button>
    <button class="qcmd" onclick="runCmd('git commit -m \"feat: nuevo cambio\"')">commit</button>
    <button class="qcmd" onclick="runCmd('git branch feature')">branch</button>
    <button class="qcmd" onclick="runCmd('git checkout feature')">checkout</button>
    <button class="qcmd" onclick="runCmd('git merge feature')">merge</button>
    <button class="qcmd" onclick="runCmd('git tag v1.0')">tag</button>
    <button class="qcmd" onclick="runCmd('git reset HEAD~1')">reset</button>
    <button class="qcmd" onclick="runCmd('git rebase main')">rebase</button>
    <button class="qcmd" onclick="runCmd('git stash')">stash</button>
    <button class="qcmd" onclick="runCmd('git help')">ayuda</button>
  </div>
  <div class="input-row">
    <span class="prompt-prefix">$&nbsp;</span>
    <input id="cmdInput" type="text" placeholder="git commit -m &quot;mi mensaje&quot;" autocomplete="off" spellcheck="false" />
    <button class="run-btn" onclick="executeInput()">EJECUTAR ↵</button>
  </div>
</footer>

<div id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const BRANCH_COLORS = ['#00e5ff','#39ff8a','#ff6b35','#b36bff','#ffd166','#ff4fa3','#38bdf8','#fb923c'];

const state = {
  initialized: false,
  commits: [],          // { id, hash, message, branch, parents, x, y }
  branches: {},         // name -> hash
  HEAD: null,           // commit hash
  currentBranch: null,
  branchColors: {},
  stash: [],
  tags: {},             // tag -> hash
  cmdHistory: [],
  historyIdx: -1,
  offsetX: 40,
  offsetY: 60,
  scale: 1,
  dragging: false,
  dragStart: null,
};

let nextColorIdx = 0;
function branchColor(name) {
  if (!state.branchColors[name]) {
    state.branchColors[name] = BRANCH_COLORS[nextColorIdx % BRANCH_COLORS.length];
    nextColorIdx++;
  }
  return state.branchColors[name];
}

function shortHash(h) { return h.slice(0,7); }
function makeHash() { return Math.random().toString(16).slice(2,10); }

// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('gitCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth * devicePixelRatio;
  canvas.height = wrap.clientHeight * devicePixelRatio;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
  draw();
}
window.addEventListener('resize', resize);

// Pan
canvas.addEventListener('mousedown', e => {
  state.dragging = true;
  state.dragStart = { x: e.clientX - state.offsetX, y: e.clientY - state.offsetY };
});
canvas.addEventListener('mousemove', e => {
  if (!state.dragging) return;
  state.offsetX = e.clientX - state.dragStart.x;
  state.offsetY = e.clientY - state.dragStart.y;
  draw();
});
canvas.addEventListener('mouseup', () => { state.dragging = false; });
canvas.addEventListener('mouseleave', () => { state.dragging = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.scale = Math.max(0.4, Math.min(2.5, state.scale - e.deltaY * 0.001));
  draw();
}, { passive: false });

// ─── Layout helpers ───────────────────────────────────────────────────────────
const NODE_R = 14;
const COL_W  = 110;
const ROW_H  = 80;

function layoutCommits() {
  // Assign column per branch
  const branchCols = {};
  let col = 0;
  // main/master always col 0
  for (const b of Object.keys(state.branchColors)) {
    if (b === 'main' || b === 'master') { branchCols[b] = 0; }
    else { col++; branchCols[b] = col; }
  }

  // Assign positions by order of creation (row = index in array for that branch)
  const branchRow = {};
  for (const c of state.commits) {
    const b = c.branch;
    if (!(b in branchRow)) branchRow[b] = 0;
    c.x = (branchCols[b] ?? 0) * COL_W + NODE_R + 10;
    c.y = branchRow[b] * ROW_H + NODE_R + 10;
    branchRow[b]++;
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(devicePixelRatio, devicePixelRatio);

  const dpr = 1; // already scaled
  const ox = state.offsetX, oy = state.offsetY, sc = state.scale;
  ctx.translate(ox, oy);
  ctx.scale(sc, sc);

  if (!state.initialized) {
    drawEmpty();
    ctx.restore();
    return;
  }

  layoutCommits();

  // Draw edges
  ctx.lineCap = 'round';
  for (const c of state.commits) {
    for (const pid of (c.parents || [])) {
      const parent = state.commits.find(x => x.id === pid);
      if (!parent) continue;
      const color = branchColor(c.branch);
      ctx.strokeStyle = color + 'aa';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      // Curved bezier
      ctx.moveTo(c.x, c.y);
      const dx = parent.x - c.x, dy = parent.y - c.y;
      ctx.bezierCurveTo(
        c.x, c.y + dy * 0.5,
        parent.x, parent.y - dy * 0.5,
        parent.x, parent.y
      );
      ctx.stroke();
    }
  }

  // Draw nodes
  for (const c of state.commits) {
    const color = branchColor(c.branch);
    const isHEAD = c.id === state.HEAD;

    // Glow
    if (isHEAD) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
    }

    // Circle
    ctx.beginPath();
    ctx.arc(c.x, c.y, NODE_R, 0, Math.PI * 2);
    ctx.fillStyle = isHEAD ? color : '#13161e';
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = isHEAD ? 3 : 2;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Hash label inside
    ctx.fillStyle = isHEAD ? '#000' : color;
    ctx.font = `bold ${7 / sc < 7 ? 7 : 7}px JetBrains Mono`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(shortHash(c.id).slice(0,5), c.x, c.y);

    // Message
    ctx.fillStyle = '#c9d1e0cc';
    ctx.font = `${10}px JetBrains Mono`;
    ctx.textAlign = 'left';
    ctx.fillText(truncate(c.message, 22), c.x + NODE_R + 8, c.y);

    // Branch label(s)
    const branchLabels = Object.entries(state.branches)
      .filter(([, h]) => h === c.id)
      .map(([b]) => b);
    branchLabels.forEach((bl, i) => {
      const bcolor = branchColor(bl);
      const bw = bl.length * 7 + 10;
      ctx.fillStyle = bcolor + '22';
      ctx.strokeStyle = bcolor;
      ctx.lineWidth = 1;
      const bx = c.x + NODE_R + 8;
      const by = c.y - 22 - i * 18;
      roundRect(ctx, bx, by - 8, bw, 16, 3);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = bcolor;
      ctx.font = `bold 9px JetBrains Mono`;
      ctx.textAlign = 'left';
      ctx.fillText(bl, bx + 5, by);
    });

    // Tags
    const tagLabels = Object.entries(state.tags)
      .filter(([, h]) => h === c.id)
      .map(([t]) => t);
    tagLabels.forEach((tl, i) => {
      const tw = tl.length * 7 + 10;
      ctx.fillStyle = '#ffd16622';
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 1;
      const tx2 = c.x - NODE_R - tw - 4;
      const ty = c.y - 8 + i * 18;
      roundRect(ctx, tx2, ty, tw, 16, 3);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd166';
      ctx.font = `bold 9px JetBrains Mono`;
      ctx.textAlign = 'left';
      ctx.fillText(tl, tx2 + 5, ty + 8);
    });

    // HEAD pointer
    if (isHEAD && !branchLabels.includes(state.currentBranch)) {
      ctx.fillStyle = '#ffd166';
      ctx.font = `bold 8px JetBrains Mono`;
      ctx.textAlign = 'center';
      ctx.fillText('HEAD', c.x, c.y - NODE_R - 6);
    }
  }

  ctx.restore();
}

function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawEmpty() {
  ctx.fillStyle = '#1e2330';
  ctx.font = '14px JetBrains Mono';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = (canvas.width / devicePixelRatio) / 2 - state.offsetX;
  const cy = (canvas.height / devicePixelRatio) / 2 - state.offsetY;
  ctx.fillText('Escribe  git init  para comenzar', cx, cy);
}

// ─── Command parser ───────────────────────────────────────────────────────────
const COMMANDS = {
  'git init': cmdInit,
  'git commit': cmdCommit,
  'git branch': cmdBranch,
  'git checkout': cmdCheckout,
  'git merge': cmdMerge,
  'git tag': cmdTag,
  'git reset': cmdReset,
  'git rebase': cmdRebase,
  'git stash': cmdStash,
  'git log': cmdLog,
  'git status': cmdStatus,
  'git help': cmdHelp,
  'clear': cmdClear,
};

function parseCmd(raw) {
  const parts = raw.trim().split(/\s+/);
  return { parts, base: parts.slice(0,2).join(' '), args: parts.slice(2) };
}

function runCmd(raw) {
  document.getElementById('cmdInput').value = raw;
  executeInput();
}

function executeInput() {
  const input = document.getElementById('cmdInput');
  const raw = input.value.trim();
  if (!raw) return;

  input.value = '';
  state.cmdHistory.unshift(raw);
  state.historyIdx = -1;

  log('cmd', '$ ' + raw);

  const { base, args, parts } = parseCmd(raw);

  // Handle "git checkout -b <branch>" specially
  if (parts[0]==='git' && parts[1]==='checkout' && parts[2]==='-b') {
    cmdCheckoutB(parts[3]);
    return;
  }

  const handler = COMMANDS[base];
  if (handler) {
    handler(args, parts);
  } else if (raw.startsWith('git ')) {
    log('error', `Comando no reconocido: "${base}". Escribe "git help" para ver los disponibles.`);
  } else {
    log('error', `Solo se soportan comandos Git. Empieza con "git ..."`);
  }

  updateUI();
  draw();
}

// ─── Commands ─────────────────────────────────────────────────────────────────
function cmdInit() {
  if (state.initialized) { log('error', 'Repositorio ya inicializado.'); return; }
  state.initialized = true;
  state.currentBranch = 'main';
  branchColor('main');
  state.branches['main'] = null;
  state.HEAD = null;
  log('success', 'Repositorio Git inicializado en .git/');

  // auto first commit for visual clarity
  _addCommit('Initial commit');
  log('info', 'Commit inicial creado automáticamente: "Initial commit"');
}

function cmdCommit(args) {
  if (!state.initialized) { log('error', 'No hay repositorio. Ejecuta git init primero.'); return; }
  let msg = 'commit';
  const mIdx = args.indexOf('-m');
  if (mIdx !== -1) {
    msg = args.slice(mIdx + 1).join(' ').replace(/^["']|["']$/g, '');
  }
  _addCommit(msg);
  log('success', `[${state.currentBranch} ${shortHash(state.HEAD)}] ${msg}`);
}

function _addCommit(msg) {
  const id = makeHash();
  const commit = {
    id,
    message: msg,
    branch: state.currentBranch,
    parents: state.HEAD ? [state.HEAD] : [],
    x: 0, y: 0,
  };
  state.commits.push(commit);
  state.HEAD = id;
  state.branches[state.currentBranch] = id;
  return commit;
}

function cmdBranch(args) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  if (!args.length) {
    const list = Object.keys(state.branches).map(b => (b === state.currentBranch ? '* ' : '  ') + b).join('\n');
    log('info', 'Ramas:\n' + list);
    return;
  }
  const name = args[0];
  if (args[0] === '-d' || args[0] === '-D') {
    const target = args[1];
    if (!target) { log('error', 'Especifica el nombre de la rama a eliminar.'); return; }
    if (target === state.currentBranch) { log('error', 'No puedes eliminar la rama actual.'); return; }
    if (!state.branches[target]) { log('error', `Rama "${target}" no encontrada.`); return; }
    delete state.branches[target];
    delete state.branchColors[target];
    log('success', `Rama "${target}" eliminada.`);
    return;
  }
  if (state.branches[name] !== undefined) { log('error', `La rama "${name}" ya existe.`); return; }
  state.branches[name] = state.HEAD;
  branchColor(name);
  log('success', `Rama "${name}" creada en ${shortHash(state.HEAD || '0000000')}`);
}

function cmdCheckout(args) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  const target = args[0];
  if (!target) { log('error', 'Especifica una rama o hash.'); return; }
  if (state.branches[target] !== undefined) {
    state.currentBranch = target;
    if (state.branches[target]) state.HEAD = state.branches[target];
    log('success', `Cambiado a rama "${target}"`);
  } else {
    const c = state.commits.find(x => x.id.startsWith(target));
    if (c) {
      state.HEAD = c.id;
      state.currentBranch = c.branch;
      log('info', `HEAD en commit ${shortHash(c.id)} (detached)`);
    } else {
      log('error', `Rama o commit "${target}" no encontrado.`);
    }
  }
}

function cmdCheckoutB(name) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  if (!name) { log('error', 'Especifica el nombre de la nueva rama.'); return; }
  if (state.branches[name] !== undefined) { log('error', `La rama "${name}" ya existe.`); return; }
  state.branches[name] = state.HEAD;
  branchColor(name);
  state.currentBranch = name;
  log('success', `Nueva rama "${name}" creada y checkout realizado`);
  updateUI(); draw();
}

function cmdMerge(args) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  const src = args[0];
  if (!src) { log('error', 'Especifica la rama a mergear.'); return; }
  if (!state.branches[src]) { log('error', `Rama "${src}" no encontrada.`); return; }
  if (src === state.currentBranch) { log('error', 'No puedes mergear una rama consigo misma.'); return; }

  const srcHead = state.branches[src];
  const mergeId = makeHash();
  const mergeCommit = {
    id: mergeId,
    message: `Merge branch '${src}' into ${state.currentBranch}`,
    branch: state.currentBranch,
    parents: [state.HEAD, srcHead],
    x: 0, y: 0,
  };
  state.commits.push(mergeCommit);
  state.HEAD = mergeId;
  state.branches[state.currentBranch] = mergeId;
  log('success', `Merge de "${src}" en "${state.currentBranch}" completado.`);
}

function cmdTag(args) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  const name = args[0];
  if (!name) { log('info', 'Tags: ' + Object.keys(state.tags).join(', ') || '(ninguno)'); return; }
  if (state.tags[name]) { log('error', `Tag "${name}" ya existe.`); return; }
  state.tags[name] = state.HEAD;
  log('success', `Tag "${name}" creado en ${shortHash(state.HEAD)}`);
}

function cmdReset(args) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  if (args[0] === 'HEAD~1' || args[0] === 'HEAD~') {
    const cur = state.commits.find(c => c.id === state.HEAD);
    if (!cur || !cur.parents.length) { log('error', 'No hay commit previo.'); return; }
    state.HEAD = cur.parents[0];
    state.branches[state.currentBranch] = state.HEAD;
    state.commits = state.commits.filter(c => c.id !== cur.id);
    log('success', `Reset a ${shortHash(state.HEAD)}`);
  } else if (args[0] === '--hard' && args[1]) {
    const c = state.commits.find(x => x.id.startsWith(args[1]));
    if (!c) { log('error', 'Commit no encontrado.'); return; }
    state.HEAD = c.id;
    state.branches[state.currentBranch] = c.id;
    log('success', `Hard reset a ${shortHash(c.id)}`);
  } else {
    log('info', 'Uso: git reset HEAD~1  |  git reset --hard <hash>');
  }
}

function cmdRebase(args) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  const onto = args[0];
  if (!onto) { log('error', 'Especifica la rama base.'); return; }
  if (!state.branches[onto]) { log('error', `Rama "${onto}" no encontrada.`); return; }
  log('info', `Rebase de "${state.currentBranch}" sobre "${onto}" simulado.`);
  const newId = makeHash();
  const rebaseCommit = {
    id: newId,
    message: `rebase: ${state.currentBranch} onto ${onto}`,
    branch: state.currentBranch,
    parents: [state.branches[onto]],
    x: 0, y: 0,
  };
  state.commits.push(rebaseCommit);
  state.HEAD = newId;
  state.branches[state.currentBranch] = newId;
  log('success', `Rebase completado. HEAD en ${shortHash(newId)}`);
}

function cmdStash(args) {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  const sub = args[0] || 'push';
  if (sub === 'push' || sub === 'save' || !args.length) {
    state.stash.push({ ref: state.HEAD, branch: state.currentBranch });
    log('success', `Guardado en stash (${state.stash.length} entradas)`);
  } else if (sub === 'pop') {
    const entry = state.stash.pop();
    if (!entry) { log('error', 'El stash está vacío.'); return; }
    log('success', `Stash pop aplicado desde ${shortHash(entry.ref)}`);
  } else if (sub === 'list') {
    if (!state.stash.length) { log('info', 'Stash vacío.'); return; }
    state.stash.forEach((s, i) => log('info', `stash@{${i}}: WIP on ${s.branch}: ${shortHash(s.ref)}`));
  } else {
    log('info', 'Uso: git stash  |  git stash pop  |  git stash list');
  }
}

function cmdLog() {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  if (!state.commits.length) { log('info', 'No hay commits aún.'); return; }
  const recent = [...state.commits].reverse().slice(0, 8);
  recent.forEach(c => {
    log('info', `${shortHash(c.id)} (${c.branch}) ${c.message}`);
  });
}

function cmdStatus() {
  if (!state.initialized) { log('error', 'No hay repositorio.'); return; }
  log('info', `En rama: ${state.currentBranch}`);
  log('info', `HEAD: ${shortHash(state.HEAD || 'vacío')}`);
  log('info', `Ramas: ${Object.keys(state.branches).join(', ')}`);
  log('info', `Total commits: ${state.commits.length}`);
  if (state.stash.length) log('info', `Stash: ${state.stash.length} entrada(s)`);
}

function cmdHelp() {
  const cmds = [
    ['git init',                    'Inicializar repositorio'],
    ['git commit -m "msg"',         'Crear commit'],
    ['git branch <nombre>',         'Crear rama'],
    ['git checkout <rama>',         'Cambiar a rama'],
    ['git checkout -b <rama>',      'Crear y cambiar a rama'],
    ['git merge <rama>',            'Mergear rama'],
    ['git tag <nombre>',            'Crear etiqueta'],
    ['git reset HEAD~1',            'Deshacer último commit'],
    ['git rebase <rama>',           'Rebase sobre rama'],
    ['git stash / pop / list',      'Guardar/recuperar cambios'],
    ['git log',                     'Ver historial'],
    ['git status',                  'Ver estado actual'],
    ['clear',                       'Limpiar historial'],
  ];
  cmds.forEach(([c, d]) => log('info', `${c.padEnd(30)} — ${d}`));
}

function cmdClear() {
  document.getElementById('logArea').innerHTML = '';
  log('info', 'Historial limpiado.');
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function log(type, msg) {
  const area = document.getElementById('logArea');
  msg.split('\n').forEach(line => {
    const el = document.createElement('div');
    el.className = 'log-entry ' + type;
    el.textContent = line;
    area.appendChild(el);
  });
  area.scrollTop = area.scrollHeight;
}

function updateUI() {
  // Branch badge
  document.getElementById('currentBranchBadge').textContent = state.currentBranch || 'sin init';

  // Branch list
  const list = document.getElementById('branchList');
  list.innerHTML = '';
  Object.entries(state.branches).forEach(([name, hash]) => {
    const item = document.createElement('div');
    item.className = 'branch-item' + (name === state.currentBranch ? ' active' : '');
    const dot = document.createElement('div');
    dot.className = 'branch-dot';
    dot.style.background = branchColor(name);
    const label = document.createElement('span');
    label.textContent = name;
    if (hash) {
      const h = document.createElement('span');
      h.style.marginLeft = 'auto';
      h.style.color = '#4a5568';
      h.style.fontSize = '9px';
      h.textContent = shortHash(hash);
      item.append(dot, label, h);
    } else {
      item.append(dot, label);
    }
    list.appendChild(item);
  });
}

// ─── Keyboard history ─────────────────────────────────────────────────────────
document.getElementById('cmdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { executeInput(); return; }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (state.historyIdx < state.cmdHistory.length - 1) {
      state.historyIdx++;
      e.target.value = state.cmdHistory[state.historyIdx];
    }
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (state.historyIdx > 0) {
      state.historyIdx--;
      e.target.value = state.cmdHistory[state.historyIdx];
    } else {
      state.historyIdx = -1;
      e.target.value = '';
    }
  }
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
resize();
log('info', '¡Bienvenido a GitVis! Escribe "git init" para comenzar o "git help" para ver comandos disponibles.');
updateUI();
</script>
</body>
</html>
